<!doctype html>
<meta charset="utf-8">
<title>Gridsweep — Phase 01 dual-load check</title>
<h1>Gridsweep — Phase 01 dual-load check</h1>
<p>
  This stub exists only to prove <code>board.js</code> loads as a classic script
  from <code>file://</code>. Phase 03 replaces the body with the real grid.
</p>
<pre id="dump">board.js did not load.</pre>
<script src="board.js"></script>
<script>
  (function () {
    var snapshot = Gridsweep.createGame().snapshot();
    var lines = [
      snapshot.rows + 'x' + snapshot.columns + ' board, ' +
        snapshot.mineCount + ' mines',
      '',
    ];
    snapshot.cells.forEach(function (row) {
      lines.push(
        row
          .map(function (cell) {
            return cell.mine ? '*' : String(cell.adjacent);
          })
          .join(' '),
      );
    });
    document.getElementById('dump').textContent = lines.join('\n');
  })();
</script>
